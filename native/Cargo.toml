[package]
name = "raspberry-native"
version = "0.1.0"
edition = "2021"
description = "The native half of TodiumX: work that is too heavy for PHP, run on its own threads"
license = "LGPL-3.0"
publish = false

[lib]
name = "raspberry_native"
crate-type = ["cdylib"]

[dependencies]
#deflate for packet compression
miniz_oxide = "0.8.9"
#embedded JavaScript engine for behavior pack scripts (no Node.js required)
rquickjs = { version = "0.9", default-features = false, features = ["loader", "parallel"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
