name: Build TodiumX

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust target triple (default per OS)'
        required: false
        default: ''
      php_version:
        description: 'PHP version for phar build'
        required: false
        default: '8.3'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: raspberry_native_linux
            target: x86_64-unknown-linux-gnu
            lib_name: libraspberry_native.so
            php: '8.3'
          - os: windows-latest
            artifact_name: raspberry_native_windows
            target: x86_64-pc-windows-msvc
            lib_name: raspberry_native.dll
            php: '8.3'
    env:
      RUST_TARGET: ${{ matrix.target }}
      LIB_NAME: ${{ matrix.lib_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock') }}

      - name: Build native library (release)
        working-directory: native
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Verify native artifact
        shell: bash
        working-directory: native
        run: |
          ls -la target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          file target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }} || true

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: native/target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          retention-days: 30

  linux-bin:
    name: Build Linux bin (php + libs)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux native library
        uses: actions/download-artifact@v4
        with:
          name: raspberry_native_linux
          path: native/linux

      # ext-webrtc (NetherNet) is not in stock PHP, so PHP itself is built here: PHP 8.5 (ZTS) with ext-ffi built in,
      # plus ext-webrtc (axolotl-pm/ext-webrtc) on top of libdatachannel. The result is cached.
      - name: Cache PHP stack
        id: php-cache
        uses: actions/cache@v4
        with:
          path: .cache/php-stack
          key: php-stack-ubuntu24-php8.5.12-dc0.24.5-webrtc0.3.1-v1

      - name: Install build dependencies
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config cmake git patchelf \
            libssl-dev libffi-dev zlib1g-dev libonig-dev

      - name: Build libdatachannel
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          STACK="$GITHUB_WORKSPACE/.cache/php-stack"
          mkdir -p "$STACK" build-tmp
          git clone --depth 1 --branch v0.24.5 --recurse-submodules --shallow-submodules https://github.com/paullouisageneau/libdatachannel build-tmp/libdatachannel
          cmake -S build-tmp/libdatachannel -B build-tmp/libdatachannel/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$STACK/libdatachannel" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DBUILD_SHARED_LIBS=ON \
            -DNO_EXAMPLES=ON -DNO_TESTS=ON -DNO_MEDIA=ON
          cmake --build build-tmp/libdatachannel/build --parallel "$(nproc)"
          cmake --install build-tmp/libdatachannel/build
          ls -la "$STACK/libdatachannel/lib"

      - name: Build PHP 8.5 (ZTS, ffi)
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          STACK="$GITHUB_WORKSPACE/.cache/php-stack"
          PHPV=8.5.12
          cd build-tmp
          if curl -fsSL -o php-src.tar.xz "https://www.php.net/distributions/php-${PHPV}.tar.xz"; then
            tar -xJf php-src.tar.xz
            cd "php-${PHPV}"
          else
            curl -fsSL -o php-src.tar.gz "https://github.com/php/php-src/archive/refs/tags/php-${PHPV}.tar.gz"
            tar -xzf php-src.tar.gz
            cd "php-src-php-${PHPV}"
            ./buildconf --force
          fi
          ./configure --prefix="$STACK/php" --disable-all --enable-zts --enable-cli \
            --disable-cgi --disable-phpdbg --enable-phar --enable-ctype --enable-tokenizer \
            --enable-filter --enable-posix --enable-pcntl --enable-sockets --enable-mbstring \
            --with-openssl --with-zlib --with-ffi
          make -j"$(nproc)"
          make install
          "$STACK/php/bin/php" -v

      - name: Build ext-webrtc
        if: steps.php-cache.outputs.cache-hit != 'true'
        run: |
          STACK="$GITHUB_WORKSPACE/.cache/php-stack"
          cd build-tmp
          git clone --depth 1 --branch 0.3.1 https://github.com/axolotl-pm/ext-webrtc
          cd ext-webrtc
          "$STACK/php/bin/phpize"
          ./configure --with-php-config="$STACK/php/bin/php-config" --enable-webrtc --with-libdatachannel="$STACK/libdatachannel"
          make -j"$(nproc)"
          cp modules/webrtc.so "$STACK/webrtc.so"

      # PocketMine-style layout: bin/php7/bin/php, bin/php7/lib/..., bin/php7/etc/ssl
      - name: Prepare Linux bin/ (PocketMine layout)
        run: |
          STACK="$GITHUB_WORKSPACE/.cache/php-stack"
          P=bin/php7
          mkdir -p "$P/bin" "$P/lib/php/extensions" "$P/etc/ssl" bin/native
          sudo apt-get update
          sudo apt-get install -y patchelf libonig5 libffi8 zlib1g libssl3t64
          cp "$STACK/php/bin/php" "$P/bin/php"
          cp "$STACK/webrtc.so" "$P/lib/php/extensions/webrtc.so"
          cp -a "$STACK"/libdatachannel/lib/libdatachannel.so* "$P/lib/"
          cp native/linux/libraspberry_native.so bin/native/
          # bundle the shared libs php links against (not guaranteed to exist on the target distro)
          for lib in libssl.so.3 libcrypto.so.3 libz.so.1 libffi.so.8 libonig.so.5; do
            src="$(ldd "$P/bin/php" | awk -v l="$lib" '$1==l {print $3}')"
            [ -n "$src" ] || { echo "cannot resolve $lib"; exit 1; }
            cp -L "$src" "$P/lib/$lib"
          done
          # resolve libs relative to each file, no LD_LIBRARY_PATH needed
          patchelf --set-rpath '$ORIGIN/../lib' "$P/bin/php"
          patchelf --set-rpath '$ORIGIN/../..' "$P/lib/php/extensions/webrtc.so"
          for f in "$P"/lib/*.so*; do [ -L "$f" ] || patchelf --set-rpath '$ORIGIN' "$f"; done
          strip --strip-unneeded "$P/bin/php" "$P/lib/php/extensions/webrtc.so"
          # extensions are loaded by relative path; start.sh always runs from the project root
          cat > "$P/bin/php.ini" <<'INI'
          memory_limit=1024M
          date.timezone=UTC
          short_open_tag=0
          zend.assertions=-1
          error_reporting=-1
          display_errors=1
          display_startup_errors=1
          ffi.enable=1
          extension=bin/php7/lib/php/extensions/webrtc.so
          INI
          cp /etc/ssl/openssl.cnf "$P/etc/ssl/openssl.cnf" 2>/dev/null || true
          cp /etc/ssl/certs/ca-certificates.crt "$P/etc/ssl/cacert.pem" 2>/dev/null || true
          chmod +x "$P/bin/php"
          "$P/bin/php" -c "$P/bin/php.ini" -v
          MODS="$("$P/bin/php" -c "$P/bin/php.ini" -m)"
          for ext in webrtc ffi phar openssl zlib json mbstring pcntl; do
            echo "$MODS" | grep -qix "$ext" || { echo "Missing PHP extension in bundle: $ext"; exit 1; }
          done
          "$P/bin/php" -c "$P/bin/php.ini" -r 'exit(class_exists("pmmp\\webrtc\\PeerConnection") ? 0 : 1);'
          ls -laR bin | head -60

      # ONLY bin/ goes into the archive (php, webrtc.so, libdatachannel, native lib, ssl extras, php.ini)
      - name: Create Linux bin archive
        run: |
          mkdir -p dist-linux
          tar -czf dist-linux/TodiumX-linux-x86_64-bin.tar.gz --owner=0 --group=0 bin
          tar -tzf dist-linux/TodiumX-linux-x86_64-bin.tar.gz | head -30
          ls -la dist-linux/

      - name: Upload Linux bin
        uses: actions/upload-artifact@v4
        with:
          name: todiumx-linux-bin
          path: dist-linux/TodiumX-linux-x86_64-bin.tar.gz
          retention-days: 30

  windows-bin:
    name: Build Windows bin (php.exe + dlls)
    runs-on: windows-2022
    needs: build
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows native library
        uses: actions/download-artifact@v4
        with:
          name: raspberry_native_windows
          path: native/windows

      # Official PHP 8.5 x64 *thread-safe* build (same ZTS flavour as the Linux bundle).
      - name: Install PHP 8.5 (TS)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi, openssl, mbstring, sockets
          coverage: none
        env:
          phpts: ts

      - name: Cache Windows webrtc stack
        id: win-cache
        uses: actions/cache@v4
        with:
          path: .cache/win-stack
          key: win-stack-php8.5-dc-vcpkg-webrtc0.3.1-v1

      # libdatachannel (+ its openssl/juice/usrsctp deps) from vcpkg, dynamic DLLs
      - name: Build libdatachannel (vcpkg)
        if: steps.win-cache.outputs.cache-hit != 'true'
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libdatachannel:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $dst = "$env:GITHUB_WORKSPACE\.cache\win-stack\libdatachannel"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\*" $dst -Recurse -Force
          Get-ChildItem "$dst\bin" -Filter *.dll | Select-Object Name

      # ext-webrtc needs a config.w32 in axolotl-pm/ext-webrtc. If this step fails, that is the first thing to check.
      - name: Build ext-webrtc
        if: steps.win-cache.outputs.cache-hit != 'true'
        uses: php/php-windows-builder/extension@v1
        with:
          extension-url: https://github.com/axolotl-pm/ext-webrtc
          extension-ref: '0.3.1'
          php-version: '8.5'
          arch: x64
          ts: ts
          args: --enable-webrtc --with-libdatachannel=${{ github.workspace }}\.cache\win-stack\libdatachannel

      - name: Collect php_webrtc.dll
        if: steps.win-cache.outputs.cache-hit != 'true'
        run: |
          $dll = Get-ChildItem -Path $env:GITHUB_WORKSPACE, "$env:RUNNER_TEMP", "D:\a" -Recurse -Filter php_webrtc.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "php_webrtc.dll not found after extension build" }
          Write-Host "Found $($dll.FullName)"
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\.cache\win-stack\php_webrtc.dll"

      - name: Prepare Windows bin/
        run: |
          $stack = "$env:GITHUB_WORKSPACE\.cache\win-stack"
          $phpDir = Split-Path (Get-Command php).Source
          Write-Host "PHP dir: $phpDir"
          New-Item -ItemType Directory -Force -Path bin\php, bin\native | Out-Null

          # php.exe + its runtime dlls + ext\ (cgi/phpdbg/ini templates are not needed)
          Copy-Item "$phpDir\*" bin\php -Recurse -Force
          Remove-Item bin\php\php-cgi.exe, bin\php\phpdbg.exe, bin\php\php-win.exe, bin\php\*.pdb, bin\php\php.ini* -Force -ErrorAction SilentlyContinue

          # webrtc extension + libdatachannel dlls (never overwrite PHP's own openssl dlls)
          Copy-Item "$stack\php_webrtc.dll" bin\php\ext\php_webrtc.dll -Force
          Get-ChildItem "$stack\libdatachannel\bin" -Filter *.dll | ForEach-Object {
            $target = Join-Path bin\php $_.Name
            if (-not (Test-Path $target)) { Copy-Item $_.FullName $target }
          }

          # native library (loaded through FFI)
          Copy-Item native\windows\raspberry_native.dll bin\native\ -Force

          # ssl extras expected by start.cmd
          New-Item -ItemType Directory -Force -Path bin\php\extras\ssl | Out-Null
          if (-not (Test-Path bin\php\extras\ssl\openssl.cnf)) { New-Item -ItemType File bin\php\extras\ssl\openssl.cnf | Out-Null }
          Invoke-WebRequest https://curl.se/ca/cacert.pem -OutFile bin\php\extras\ssl\cacert.pem

          # extensions are loaded by relative path; start.cmd always runs from the project root
          @"
          memory_limit=1024M
          date.timezone=UTC
          short_open_tag=0
          zend.assertions=-1
          error_reporting=-1
          display_errors=1
          display_startup_errors=1
          ffi.enable=1
          extension_dir=bin/php/ext
          extension=ffi
          extension=openssl
          extension=mbstring
          extension=sockets
          extension=webrtc
          "@ | ForEach-Object { $_ -replace '(?m)^\s+', '' } | Set-Content -Encoding ascii bin\php\php.ini

          .\bin\php\php.exe -c bin\php\php.ini -v
          $mods = (.\bin\php\php.exe -c bin\php\php.ini -m) -join "`n"
          foreach ($ext in 'webrtc','ffi','phar','openssl','zlib','json','mbstring') {
            if ($mods -notmatch "(?mi)^$ext\s*$") { throw "Missing PHP extension in bundle: $ext" }
          }
          .\bin\php\php.exe -c bin\php\php.ini -r 'exit(class_exists("pmmp\\webrtc\\PeerConnection") ? 0 : 1);'
          if ($LASTEXITCODE -ne 0) { throw "pmmp\webrtc\PeerConnection not available" }

      # ONLY bin\ goes into the archive
      - name: Create Windows bin archive
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows | Out-Null
          Compress-Archive -Path bin -DestinationPath dist-windows\TodiumX-windows-x86_64-bin.zip
          Get-Item dist-windows\*.zip | Select-Object Name, Length

      - name: Upload Windows bin
        uses: actions/upload-artifact@v4
        with:
          name: todiumx-windows-bin
          path: dist-windows/TodiumX-windows-x86_64-bin.zip
          retention-days: 30

  phar:
    name: Build PHAR (CI)
    runs-on: ubuntu-latest
    needs: build
    env:
      PHP_VERSION: '8.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ffi, zlib, json, mbstring, openssl, pcntl
          ini-values: phar.readonly=0
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

      - name: Prepare bin/native
        run: |
          mkdir -p bin/native
          ls -la native/
          cp native/libraspberry_native.so bin/native/ 2>/dev/null || true
          cp native/raspberry_native.dll bin/native/ 2>/dev/null || true
          ls -la bin/native/

      - name: Build PHAR
        run: |
          php -d phar.readonly=0 build/make-server.php

      - name: Verify PHAR
        run: |
          ls -la bin/server.phar 2>/dev/null || ls -la TodiumX.phar 2>/dev/null || find . -name "*.phar" -maxdepth 2
          php bin/server.phar --version 2>/dev/null || php TodiumX.phar --version 2>/dev/null || true

      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: server-phar
          path: |
            bin/server.phar
            TodiumX.phar
          retention-days: 30

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, phar, linux-bin, windows-bin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          ls -la dist/
          mkdir -p release-assets
          # native libs
          mv dist/raspberry_native_linux/libraspberry_native.so release-assets/raspberry_native-linux-x86_64.so 2>/dev/null || true
          mv dist/raspberry_native_windows/raspberry_native.dll release-assets/raspberry_native-windows-x86_64.dll 2>/dev/null || true
          # phar
          mv dist/server-phar/server.phar release-assets/server.phar 2>/dev/null || true
          mv dist/server-phar/TodiumX.phar release-assets/TodiumX.phar 2>/dev/null || true
          find dist -name "*.phar" -exec mv {} release-assets/ 2>/dev/null \; || true
          mv dist/todiumx-linux-bin/TodiumX-linux-x86_64-bin.tar.gz release-assets/ 2>/dev/null || true
          mv dist/todiumx-windows-bin/TodiumX-windows-x86_64-bin.zip release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TodiumX ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/raspberry_native-linux-x86_64.so
            release-assets/raspberry_native-windows-x86_64.dll
            release-assets/server.phar
            release-assets/TodiumX.phar
            release-assets/TodiumX-linux-x86_64-bin.tar.gz
            release-assets/TodiumX-windows-x86_64-bin.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
