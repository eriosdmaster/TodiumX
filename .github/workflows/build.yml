name: Build TodiumX

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust target triple (default per OS)'
        required: false
        default: ''
      php_version:
        description: 'PHP version for phar build'
        required: false
        default: '8.3'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: raspberry_native_linux
            target: x86_64-unknown-linux-gnu
            lib_name: libraspberry_native.so
            php: '8.3'
          - os: windows-latest
            artifact_name: raspberry_native_windows
            target: x86_64-pc-windows-msvc
            lib_name: raspberry_native.dll
            php: '8.3'
    env:
      RUST_TARGET: ${{ matrix.target }}
      LIB_NAME: ${{ matrix.lib_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock') }}

      - name: Build native library (release)
        working-directory: native
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Verify native artifact
        shell: bash
        working-directory: native
        run: |
          ls -la target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          file target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }} || true

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: native/target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          retention-days: 30

  linux-bin:
    name: Build Linux Binary Bundle
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux native library
        uses: actions/download-artifact@v4
        with:
          name: raspberry_native_linux
          path: native/linux

      - name: Install system PHP + extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli php8.3-common php8.3-mbstring php8.3-curl php8.3-xml php8.3-sqlite3 php8.3-pgsql php8.3-intl php8.3-gd php8.3-zip unzip

      - name: Prepare Linux bin/php from system
        run: |
          mkdir -p bin/php/extras/ssl
          # Copy PHP binary
          cp "$(which php)" bin/php/php
          chmod +x bin/php/php
          # php.ini
          PHP_INI="$(php -r 'echo php_ini_loaded_file();')"
          if [ -n "$PHP_INI" ] && [ -f "$PHP_INI" ]; then cp "$PHP_INI" bin/php/php.ini; fi
          # SSL
          cp /etc/ssl/openssl.cnf bin/php/extras/ssl/openssl.cnf 2>/dev/null || true
          cp /etc/ssl/certs/ca-certificates.crt bin/php/extras/ssl/cacert.pem 2>/dev/null || true
          # Copy required shared libraries (ldd on php binary)
          ldd "$(which php)" | awk '{print $3}' | grep -E '^/' | sort -u | while read lib; do
            if [ -f "$lib" ]; then
              cp "$lib" bin/php/ 2>/dev/null || true
            fi
          done
          # Also copy the extension .so files
          EXT_DIR="$(php -r 'echo ini_get("extension_dir");')"
          if [ -d "$EXT_DIR" ]; then cp "$EXT_DIR"/*.so bin/php/ 2>/dev/null || true; fi
          ls -la bin/php/

      - name: Copy native library
        run: |
          mkdir -p bin/native
          cp native/linux/libraspberry_native.so bin/native/

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build PHAR
        run: |
          php -d phar.readonly=0 build/make-server.php

      - name: Verify binary bundle
        run: |
          ls -la bin/php/
          ls -la bin/native/
          ./start.sh --version 2>&1 || true

      - name: Create Linux release archive
        run: |
          mkdir -p dist-linux
          tar --exclude=./.git --exclude=./dist-linux --exclude=./native/target -czf dist-linux/TodiumX-stable-linux-x86_64.tar.gz --owner=0 --group=0 .
          ls -la dist-linux/

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: todiumx-linux-bundle
          path: dist-linux/TodiumX-stable-linux-x86_64.tar.gz
          retention-days: 30

  phar:
    name: Build PHAR (CI)
    runs-on: ubuntu-latest
    needs: build
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ffi, zlib, json, mbstring, openssl, pcntl
          ini-values: phar.readonly=0
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare bin/native
        run: |
          mkdir -p bin/native
          ls -la native/
          cp native/libraspberry_native.so bin/native/ 2>/dev/null || true
          cp native/raspberry_native.dll bin/native/ 2>/dev/null || true
          ls -la bin/native/

      - name: Build PHAR
        run: |
          php -d phar.readonly=0 build/make-server.php

      - name: Verify PHAR
        run: |
          ls -la bin/server.phar 2>/dev/null || ls -la RaspberryX.phar 2>/dev/null || find . -name "*.phar" -maxdepth 2
          php bin/server.phar --version 2>/dev/null || php RaspberryX.phar --version 2>/dev/null || true

      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: server-phar
          path: |
            bin/server.phar
            RaspberryX.phar
          retention-days: 30

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, phar, linux-bin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          ls -la dist/
          mkdir -p release-assets
          # native libs
          mv dist/raspberry_native_linux/libraspberry_native.so release-assets/raspberry_native-linux-x86_64.so 2>/dev/null || true
          mv dist/raspberry_native_windows/raspberry_native.dll release-assets/raspberry_native-windows-x86_64.dll 2>/dev/null || true
          # phar
          mv dist/server-phar/server.phar release-assets/server.phar 2>/dev/null || true
          mv dist/server-phar/RaspberryX.phar release-assets/RaspberryX.phar 2>/dev/null || true
          find dist -name "*.phar" -exec mv {} release-assets/ 2>/dev/null \; || true
          mv dist/todiumx-linux-bundle/TodiumX-stable-linux-x86_64.tar.gz release-assets/ 2>/dev/null || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TodiumX ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/raspberry_native-linux-x86_64.so
            release-assets/raspberry_native-windows-x86_64.dll
            release-assets/server.phar
            release-assets/RaspberryX.phar
            release-assets/TodiumX-stable-linux-x86_64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
