name: Build TodiumX

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust target triple (default per OS)'
        required: false
        default: ''
      php_version:
        description: 'PHP version for phar build'
        required: false
        default: '8.3'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: raspberry_native_linux
            target: x86_64-unknown-linux-gnu
            lib_name: libraspberry_native.so
            php: '8.3'
          - os: macos-latest
            artifact_name: raspberry_native_macos
            target: x86_64-apple-darwin
            lib_name: libraspberry_native.dylib
            php: '8.3'
          - os: windows-latest
            artifact_name: raspberry_native_windows
            target: x86_64-pc-windows-msvc
            lib_name: raspberry_native.dll
            php: '8.3'
    env:
      RUST_TARGET: ${{ matrix.target }}
      LIB_NAME: ${{ matrix.lib_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            TodiumX-stable/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('TodiumX-stable/native/Cargo.toml', 'TodiumX-stable/native/Cargo.lock') }}

      - name: Build native library (release)
        working-directory: native
        run: cargo build --release --target ${{ env.RUST_TARGET }}

      - name: Verify native artifact
        working-directory: native
        run: |
          ls -la target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          file target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: native/target/${{ env.RUST_TARGET }}/release/${{ env.LIB_NAME }}
          retention-days: 30

  phar:
    name: Build PHAR
    runs-on: ubuntu-latest
    needs: build
    env:
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ffi, zlib, json, mbstring, openssl, pcntl
          ini-values: phar.readonly=0
          coverage: none

      - name: Install Composer dependencies
        working-directory: TodiumX-stable
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Prepare bin/native
        working-directory: TodiumX-stable
        run: |
          mkdir -p bin/native
          # native artifacts downloaded to ./native/ (flat)
          ls -la ../native/
          # Copy linux .so (we're on ubuntu)
          cp ../native/libraspberry_native.so bin/native/ 2>/dev/null || true
          cp ../native/raspberry_native.dll bin/native/ 2>/dev/null || true
          cp ../native/libraspberry_native.dylib bin/native/ 2>/dev/null || true
          ls -la bin/native/

      - name: Build PHAR
        working-directory: TodiumX-stable
        run: |
          php -d phar.readonly=0 build/make-server.php
          # copy native library into bin/native for distribution
          mkdir -p bin/native
          cp ../native/libraspberry_native.so bin/native/ 2>/dev/null || true

      - name: Verify PHAR
        working-directory: TodiumX-stable
        run: |
          ls -la bin/server.phar 2>/dev/null || ls -la RaspberryX.phar 2>/dev/null || find . -name "*.phar" -maxdepth 2
          php bin/server.phar --version 2>/dev/null || php RaspberryX.phar --version 2>/dev/null || true

      - name: Upload PHAR
        uses: actions/upload-artifact@v4
        with:
          name: server-phar
          path: |
            TodiumX-stable/bin/server.phar
            TodiumX-stable/RaspberryX.phar
          retention-days: 30

  release:
    name: Create Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, phar]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          ls -la dist/
          # Flatten artifacts
          mkdir -p release-assets
          # native libs (artifact names as folders)
          mv dist/raspberry_native_linux/libraspberry_native.so release-assets/raspberry_native-linux-x86_64.so 2>/dev/null || true
          mv dist/raspberry_native_macos/libraspberry_native.dylib release-assets/raspberry_native-macos-x86_64.dylib 2>/dev/null || true
          mv dist/raspberry_native_windows/raspberry_native.dll release-assets/raspberry_native-windows-x86_64.dll 2>/dev/null || true
          # phar (may be in bin/ or root)
          mv dist/server-phar/server.phar release-assets/server.phar 2>/dev/null || true
          mv dist/server-phar/RaspberryX.phar release-assets/RaspberryX.phar 2>/dev/null || true
          # fallback: find any phar
          find dist -name "*.phar" -exec mv {} release-assets/ 2>/dev/null \; || true
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TodiumX ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-assets/raspberry_native-linux-x86_64.so
            release-assets/raspberry_native-macos-x86_64.dylib
            release-assets/raspberry_native-windows-x86_64.dll
            release-assets/server.phar
            release-assets/RaspberryX.phar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}